name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - name: Hämta senaste Yarn/Loader för 1.21.11 och bygg
        run: |
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          echo "yarn=$YARN loader=$LOADER"
          gradle build -Pyarn_mappings="$YARN" -Ploader_version="$LOADER"
      - uses: actions/upload-artifact@v4
        with:
          name: scout-mod
          path: build/libs/scout-*.jar
